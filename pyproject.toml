[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-clips"
version = "2.0.0"
description = "AI-powered long-to-short video generator with speech recognition, viral moment scoring, and NVENC rendering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Antigravity Engineering" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "click>=8.1.0",
    "imageio-ffmpeg>=0.5.0",
    "static-ffmpeg>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]
storage = [
    "boto3>=1.34.0",
    "google-api-python-client>=2.120.0",
    "google-auth>=2.28.0",
]
asr = [
    "faster-whisper>=1.0.0",
]

[project.scripts]
viral-clips = "viral_clips.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
